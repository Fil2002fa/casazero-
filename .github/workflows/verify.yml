name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Stesso script di "npm run verify" (package.json:10), ma con pwsh:
      # su ubuntu-latest l'eseguibile "powershell" non esiste.
      - name: Verify (tsc + lint)
        shell: pwsh
        run: ./scripts/verify.ps1
